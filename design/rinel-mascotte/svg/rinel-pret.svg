    <rect x="10" y="26.4" width="4.2" height="3.6" rx="1.3" fill="#3FD07F"/>
    <rect x="17.8" y="26.4" width="4.2" height="3.6" rx="1.3" fill="#3FD07F"/>
    <circle cx="16" cy="19" r="9" fill="#3FD07F"/>
